<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0871d7">
  <meta name="description" content="Поймай удачу: помогите капибаре собрать предметы за 60 секунд и заработать три награды.">
  <title>Поймай удачу</title>
  <link rel="icon" href="assets/reward.png" type="image/png">
  <link rel="preload" href="assets/background.png" as="image">
  <link rel="preload" href="assets/capy-1-open.png" as="image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone" id="phone" aria-label="Игра «Поймай удачу»">
    <div class="scene" id="scene">
      <img class="background" src="assets/background.png" alt="" draggable="false">
      <div class="sky-shade"></div>
      <header class="header">
        <img class="brand" src="assets/brand.png" alt="Лукойл. Поймай удачу" draggable="false">
        <div class="rewards-total" id="rewards-button">Награды <span id="total-rewards">0</span></div>
        <button class="image-button reset" id="reset-button" aria-label="Начать заново"><img src="assets/reset.png" alt=""></button>
        <button class="image-button close" id="close-button" aria-label="Вернуться к началу"><img src="assets/close.png" alt=""></button>
      </header>

      <section class="stats" aria-label="Результат игры">
        <div class="stat time-stat">
          <img class="stat-icon" src="assets/timer.png" alt="">
          <div class="stat-copy"><span class="stat-label"><img src="assets/label-time.svg" width="43" height="6" alt="ОСТАЛОСЬ"></span><strong id="timer" role="timer" aria-label="Осталось 60 секунд">01:00</strong></div>
          <img class="snow snow-left" src="assets/snow-left.png" alt="">
        </div>
        <div class="stat coin-stat" id="coin-stat">
          <img class="coin-icon" src="assets/coin.png" alt="">
          <div class="stat-copy"><span class="stat-label"><img src="assets/label-coins.svg" width="34" height="6" alt="МОНЕТЫ"></span><strong id="coins">0</strong></div>
          <img class="snow snow-middle" src="assets/snow-middle.png" alt="">
        </div>
        <div class="stat reward-stat" id="reward-stat">
          <img class="reward-icon" src="assets/reward.png" alt="">
          <div class="stat-copy"><span class="stat-label"><img src="assets/label-reward.svg" width="37" height="7" alt="НАГРАДА"></span><strong id="rewards">0/3</strong></div>
          <div class="progress" id="progress" role="progressbar" aria-label="Монеты до первой награды" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><div id="progress-fill"></div></div>
          <img class="snow snow-right" src="assets/snow-right.png" alt="">
        </div>
      </section>

      <div class="falling-field" id="falling-field" aria-hidden="true"></div>
      <div class="character" id="character" data-pose="open" aria-hidden="true">
        <img class="capy-image" data-pose="open" src="assets/capy-1-open.png" alt="" draggable="false">
        <img class="capy-image" data-pose="left" src="assets/capy-1-left.png" alt="" draggable="false">
        <img class="capy-image" data-pose="right" src="assets/capy-1-right.png" alt="" draggable="false">
      </div>
      <div class="character character-front" id="character-front" data-pose="open" aria-hidden="true">
        <img class="capy-image" data-pose="open" src="assets/capy-1-open.png" alt="" draggable="false">
        <img class="capy-image" data-pose="left" src="assets/capy-1-left.png" alt="" draggable="false">
        <img class="capy-image" data-pose="right" src="assets/capy-1-right.png" alt="" draggable="false">
      </div>
      <img class="foreground" src="assets/foreground.png" alt="" draggable="false">
      <div class="effects" id="effects" aria-hidden="true"></div>
      <button class="variant-button" id="variant-button" aria-label="Выбрать капибару 2" title="Сменить капибару"><span aria-hidden="true">↔</span><span id="variant-number">1/2</span></button>
      <aside class="side-buttons" aria-label="Настройки игры">
        <button class="image-button" id="help-button" aria-label="Правила игры"><img src="assets/help.png" alt=""></button>
        <button class="image-button sound-button" id="sound-button" aria-label="Включить звук" aria-pressed="false"><img src="assets/sound.png" alt=""><span class="mute-mark"></span></button>
      </aside>

      <div class="teaching-layer" id="teaching-layer" role="dialog" aria-modal="true" aria-label="Обучение управлению">
        <div class="teaching-content">
          <p>Двигайте капибару<br>пальцем и собирайте<br>предметы</p>
          <div class="gesture-track"><span class="gesture-finger"><img src="assets/gesture-dot.png" alt=""><img class="gesture-glint" src="assets/gesture-glint.png" alt=""></span></div>
        </div>
      </div>
      <div class="prize-layer" id="prize-layer" role="status" hidden>
        <div class="prize-composition" id="prize-composition">
          <img class="prize-glow" src="assets/prize-piece-0.png" alt="">
          <div class="prize-confetti" id="prize-confetti" aria-hidden="true"></div>
          <h2>Награда<br><span id="prize-message">1 из 3 получена!</span></h2>
          <img class="prize-art" src="assets/prize-icon.png" alt="">
        </div>
      </div>
      <div class="modal-layer" id="modal-layer" hidden>
        <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <img class="result-shadow" src="assets/result-shadow.png" alt="">
          <img class="modal-art" src="assets/result-capy.png" alt="Капибара с мешком монет">
          <div id="modal-content"></div>
        </section>
      </div>
      <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
    </div>
  </main>
  <noscript>Для игры включите JavaScript в браузере.</noscript>
  <script type="module" src="main.mjs"></script>
</body>
</html>
